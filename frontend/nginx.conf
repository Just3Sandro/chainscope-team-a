log_format chainscope_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent $request_time $upstream_http_x_request_id';

server {
    listen 80;
    access_log /dev/stdout chainscope_access;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    # 10 Mio de fichier + marge pour l’enveloppe multipart.
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
